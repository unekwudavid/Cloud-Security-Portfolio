<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project 2 Preview</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #071622;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .frame {
        width: min(94vw, 1500px);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 70px rgba(0,0,0,0.45);
        border: 1px solid rgba(255,255,255,0.12);
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img src="project2-hero-preview.svg" alt="Project 2 hero preview" />
    </div>
  </body>
</html>
